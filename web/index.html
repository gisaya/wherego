  <main>
    <section id="experience" class="experience">
      <div class="intro-copy"><p class="eyebrow">가까운 곳으로, 가벼운 주말</p><h1>주말어디</h1><p class="lead">이번 주말, 어디로 갈까요?</p></div>
      <form id="recommend-form" class="start-form">
        <fieldset><legend>가고 싶은 지역</legend><div class="segments three"><label><input type="radio" name="region" value="seoul" checked><span>서울</span></label><label><input type="radio" name="region" value="gyeonggi"><span>경기</span></label><label><input type="radio" name="region" value="incheon"><span>인천</span></label></div></fieldset>
        <fieldset><legend>어디에서 시간을 보낼까요?</legend><div class="segments three"><label><input type="radio" name="environment" value="any" checked><span>상관없어요</span></label><label><input type="radio" name="environment" value="indoor"><span>실내 위주</span></label><label><input type="radio" name="environment" value="outdoor"><span>야외에서</span></label></div></fieldset>
        <fieldset><legend>오늘 끌리는 것</legend><div class="segments four"><label><input type="radio" name="interest" value="nature" checked><span>초록과 자연</span></label><label><input type="radio" name="interest" value="culture"><span>전시와 역사</span></label><label><input type="radio" name="interest" value="water"><span>물가 풍경</span></label><label><input type="radio" name="interest" value="any"><span>상관없어요</span></label></div></fieldset>
        <fieldset><legend>걷는 양은 어느 정도?</legend><div class="segments two"><label><input type="radio" name="walking" value="light" checked><span>가볍게 둘러보기</span></label><label><input type="radio" name="walking" value="active"><span>충분히 걸어도 좋아요</span></label></div></fieldset>
        <button class="primary" type="submit">나들이 후보 보기 <span aria-hidden="true">→</span></button><p class="fine">로그인 없이 무료 · 정리된 장소 정보에서 조건에 맞춰 골라요.</p>
      </form>
    </section>
    <section id="results" class="results" hidden aria-live="polite"></section>
    <section class="guide-section" id="guides"><div class="section-heading"><div><p class="eyebrow">오늘의 조건부터 골라요</p><h2>상황별 나들이</h2></div><span class="muted">서울 · 경기 · 인천</span></div><div class="guide-list"><!-- GUIDE_LINKS --></div></section>
